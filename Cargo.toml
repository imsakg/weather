[package]
name = "weather"
version = "0.1.0"
edition = "2021"

description = "Current weather, forecasts and history from the terminal"
license = "MIT"
repository = "https://github.com/imsakg/weather"

[dependencies]
sha2 = "0.10.8"
tempfile = "3.5.0"
chrono = { version = "0.4.31", default-features = false, features = ["clock"] }
reqwest = { version = "0.11.14", features = ["json"] }
serde = "1.0.156"
serde_derive = "1.0.156"
serde_json = "1.0.94"
structopt = "0.3.26"
tokio = { version = "1.26.0", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 'z'
lto = true
debug = false
debug-assertions = false
codegen-units = 1
panic = 'abort'
overflow-checks = true
