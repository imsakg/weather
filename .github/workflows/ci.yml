name: Rust quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust and quality components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Lint
        run: cargo +stable clippy --all-targets --locked -- -D warnings
      - name: Offline and loopback tests
        run: cargo +stable test --locked
      - name: Release build
        run: cargo +stable build --release --locked
